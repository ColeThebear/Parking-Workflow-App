# Test configuration template.
#
# Copy this file to pytest.ini and set DATABASE_URL to your local test database.
# Never commit pytest.ini — it is gitignored because it contains local credentials.
#
# Setup:
#   1. cp backend/tests/pytest.example.ini backend/tests/pytest.ini
#   2. Edit pytest.ini and replace the DATABASE_URL placeholder with your credentials.
#   3. Or export DATABASE_URL in your shell before running pytest.

[pytest]
pythonpath = .
testpaths = tests
env =
    DATABASE_URL=postgresql+psycopg2://<user>:<password>@localhost:5432/<test_db>
